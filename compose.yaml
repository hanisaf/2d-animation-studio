# Studio and coding agents share source files and Linux dependencies.
x-workspace: &workspace
  build:
    context: .
    args:
      CODEX_VERSION: ${CODEX_VERSION:-latest}
      CLAUDE_VERSION: ${CLAUDE_VERSION:-latest}
      GEMINI_VERSION: ${GEMINI_VERSION:-latest}
  image: safadi-animation-studio:dev
  init: true
  working_dir: /workspace
  shm_size: "1gb"
  volumes:
    - .:/workspace
    - node_modules:/workspace/node_modules

services:
  studio:
    <<: *workspace
    ports:
      - "127.0.0.1:${STUDIO_PORT:-5173}:5173"
    command: ["npm", "run", "serve"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  agents:
    <<: *workspace
    profiles: ["tools"]
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    environment:
      AGENT_CONFIG_DEFAULTS: "1"
      TERM: xterm-256color
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      # Persists ~/.codex, ~/.claude, ~/.claude.json, ~/.gemini and npm caches.
      - agent_home:/home/node

volumes:
  node_modules:
  agent_home:
